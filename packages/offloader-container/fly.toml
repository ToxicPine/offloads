primary_region = "lhr"

[build]
  image = "docker.io/cardellier/container-agent:latest-opinionated"

[[mounts]]
  source = "hermes_data"
  destination = "/data"
  initial_size = "16gb"

[http_service]
  internal_port = 4096
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

# OpenCode HTTP server, exposed at https://<app>.fly.dev:8443. Enable it by
# setting the OPENCODE_SERVER_PASSWORD secret. Ports must match
# fs/opencode-ports.nix (internal = 4097, external = 8443).
[[services]]
  internal_port = 4097
  protocol = "tcp"

  [[services.ports]]
    port = 8443
    handlers = ["tls", "http"]

[env]
  WEBHOOK_ENABLED = "true"
  WEBHOOK_PORT = "8644"

[[vm]]
  size = "shared-cpu-4x"
  memory = "6gb"
