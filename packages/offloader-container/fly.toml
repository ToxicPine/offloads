primary_region = "lhr"

[build]
  image = "docker.io/cardellier/container-agent:latest-opinionated"

[[mounts]]
  source = "hermes_data"
  destination = "/data"
  initial_size = "16gb"

[http_service]
  internal_port = 4096
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

# OpenCode HTTP server, exposed at https://<app>.fly.dev:8443. Enable it by
# setting the OPENCODE_SERVER_PASSWORD secret, and set OPENCODE_SERVER_CORS to
# https://<app>.fly.dev:8443 so browser clients pass CORS.
[[services]]
  internal_port = 4097
  protocol = "tcp"

  [[services.ports]]
    port = 8443
    handlers = ["tls", "http"]

[env]
  WEBHOOK_ENABLED = "true"
  WEBHOOK_PORT = "8644"

[[vm]]
  size = "shared-cpu-4x"
  memory = "6gb"
